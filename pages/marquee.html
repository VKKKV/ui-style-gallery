<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03 — Infinite Marquee</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    /* Hallmark · interaction: infinite-marquee · pre-emit: P4 H3 E4 S3 R5 V3 */
    :root { --accent: #ff3366; }
    body { background: #0a0a0a; overflow: hidden; }

    .marquee-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      position: relative;
    }

    /* ── Marquee Band ── */
    .marquee-band {
      display: flex;
      overflow: hidden;
      white-space: nowrap;
      padding: 1.5rem 0;
    }
    .marquee-band.is-reverse .marquee-track {
      animation-direction: reverse;
    }

    .marquee-track {
      display: flex;
      animation: marqueeLoop var(--speed, 40s) linear infinite;
      will-change: transform;
    }

    .marquee-item {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 0 2rem;
      flex-shrink: 0;
    }
    .marquee-item .label {
      font-family: 'Fjalla One', serif;
      font-size: clamp(2rem, 6vw, 4rem);
      color: #fff;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .marquee-item .dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* SVG line art divider */
    .marquee-divider {
      width: 100%;
      overflow: hidden;
      height: 60px;
      display: flex;
      align-items: center;
    }
    .marquee-divider-track {
      display: flex;
      animation: marqueeLoop 30s linear infinite;
      will-change: transform;
    }
    .marquee-divider-track.reverse {
      animation-direction: reverse;
    }
    .marquee-divider svg {
      flex-shrink: 0;
      height: 60px;
      width: auto;
    }

    @keyframes marqueeLoop { to { transform: translateX(-50%); } }
    .marquee-track, .marquee-divider-track { flex-shrink: 0; }
    .marquee-page.is-paused .marquee-track,
    .marquee-page.is-paused .marquee-divider-track { animation-play-state: paused; }

    /* Alternate band colors */
    .marquee-band:nth-child(odd) .label { color: #fff; }
    .marquee-band:nth-child(even) .label { color: rgba(255,255,255,0.3); }
    .marquee-band:nth-child(even) .dot { background: rgba(255,51,102,0.3); }

    /* Center floating content */
    .marquee-center {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    .marquee-center-inner {
      text-align: center;
      pointer-events: auto;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(20px);
      padding: 3rem 4rem;
      border-radius: 16px;
      border: 1px solid #222;
    }
    .marquee-center-inner h2 {
      font-family: 'Fjalla One', serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .marquee-center-inner p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.1em;
    }

    /* Speed controls */
    .speed-controls {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      width: min(95%, 700px);
      z-index: 20;
    }
    .speed-btn {
      padding: 0.4rem 1rem;
      border: 1px solid #333;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #666;
      letter-spacing: 0.1em;
      transition: all 0.3s;
    }
    .speed-btn:hover, .speed-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <nav class="page-header">
    <a href="../index.html">Gallery</a>
    <span class="sep">/</span>
    <span class="current">03 Infinite Marquee</span>
  </nav>

  <div class="marquee-page" id="marqueePage" aria-hidden="true">
    <!-- Generated by JS -->
  </div>

  <div class="marquee-center">
    <div class="marquee-center-inner">
      <h2>INFINITE MARQUEE</h2>
      <p>DUAL-BAND OPPOSING DIRECTION SCROLL</p>
    </div>
  </div>

  <div class="speed-controls">
    <button class="speed-btn" data-speed="80" aria-pressed="false" onclick="setMarqueeSpeed(80)">SLOW</button>
    <button class="speed-btn active" data-speed="40" aria-pressed="true" onclick="setMarqueeSpeed(40)">NORMAL</button>
    <button class="speed-btn" data-speed="15" aria-pressed="false" onclick="setMarqueeSpeed(15)">FAST</button>
    <button class="speed-btn" data-speed="5" aria-pressed="false" onclick="setMarqueeSpeed(5)">GOTTA GO FAST</button>
    <button class="speed-btn" id="pauseMarquee" aria-pressed="false">PAUSE</button>
  </div>

  <script>
    const words = [
      'DESIGN', 'MOTION', 'RHYTHM', 'FLOW', 'PULSE',
      'ECHO', 'DRIFT', 'GLITCH', 'WAVE', 'FLUX',
      'SPARK', 'NOVA', 'VOID', 'NEON', 'AXIS',
    ];

    function makeSVG(reverse) {
      // Generate a decorative SVG line pattern
      const w = 600;
      const h = 60;
      let paths = '';
      for (let i = 0; i < 8; i++) {
        const y = 10 + (i * 6);
        const dashLen = 20 + Math.random() * 40;
        const gapLen = 10 + Math.random() * 20;
        paths += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" 
          stroke="rgba(255,51,102,${0.1 + Math.random() * 0.15})" 
          stroke-width="1" 
          stroke-dasharray="${dashLen} ${gapLen}"/>`;
      }
      // Add some dots
      for (let i = 0; i < 5; i++) {
        const cx = Math.random() * w;
        const cy = Math.random() * h;
        paths += `<circle cx="${cx}" cy="${cy}" r="2" fill="rgba(255,51,102,0.3)"/>`;
      }
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${paths}</svg>`;
    }

    function makeMarqueeBand(labels, reverse, speed) {
      const band = document.createElement('div');
      band.className = 'marquee-band' + (reverse ? ' is-reverse' : '');

      const track = document.createElement('div');
      track.className = 'marquee-track';
      track.style.setProperty('--speed', speed + 's');

      // Need at least 2 copies for seamless loop
      for (let copy = 0; copy < 2; copy++) {
        labels.forEach(label => {
          const item = document.createElement('div');
          item.className = 'marquee-item';
          item.innerHTML = `<span class="label">${label}</span><span class="dot"></span>`;
          track.appendChild(item);
        });
      }

      band.appendChild(track);
      return band;
    }

    function makeDivider(reverse) {
      const div = document.createElement('div');
      div.className = 'marquee-divider';
      const track = document.createElement('div');
      track.className = 'marquee-divider-track' + (reverse ? ' reverse' : '');
      // Repeat the same pattern, not independent random artwork at the seam.
      const pattern = makeSVG(reverse).repeat(Math.max(2, Math.ceil(innerWidth / 600)));
      track.innerHTML = pattern + pattern;
      div.appendChild(track);
      return div;
    }

    function buildPage() {
      const page = document.getElementById('marqueePage');
      page.innerHTML = '';

      const speeds = [40, 55, 35, 60, 45, 50];
      for (let i = 0; i < 6; i++) {
        if (i > 0 && i % 2 === 1) {
          page.appendChild(makeDivider(i % 2 === 0));
        }
        // Shuffle words
        const shuffled = [...words].sort(() => Math.random() - 0.5);
        page.appendChild(makeMarqueeBand(shuffled, i % 2 === 1, speeds[i]));
      }
    }

    buildPage();
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const pauseButton = document.getElementById('pauseMarquee');
    let paused = false;
    function syncPause() {
      const stopped = paused || motion.matches || document.hidden;
      document.getElementById('marqueePage').classList.toggle('is-paused', stopped);
      pauseButton.setAttribute('aria-pressed', String(paused || motion.matches));
      pauseButton.textContent = motion.matches ? 'REDUCED MOTION' : paused ? 'RESUME' : 'PAUSE';
      pauseButton.disabled = motion.matches;
    }
    pauseButton.addEventListener('click', () => { paused = !paused; syncPause(); });
    motion.addEventListener('change', syncPause);
    document.addEventListener('visibilitychange', syncPause);
    syncPause();

    function setMarqueeSpeed(base) {
      document.querySelectorAll('.speed-btn[data-speed]').forEach(b => {
        const active = Number(b.dataset.speed) === base;
        b.classList.toggle('active', active);
        b.setAttribute('aria-pressed', String(active));
      });
      document.querySelectorAll('.marquee-track').forEach(t => {
        t.style.setProperty('--speed', base + 's');
      });
    }
  </script>
</body>
</html>
