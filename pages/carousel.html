<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06 — Carousel + Lightbox</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <style>
    /* Hallmark · interaction: carousel-lightbox · pre-emit: P4 H3 E4 S3 R5 V3 */
    :root { --accent: #00d4ff; }
    body { background: #0a0a0a; }

    .carousel-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6rem 2rem;
      gap: 3rem;
    }

    .carousel-title {
      font-family: 'Fjalla One', serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      color: #fff;
      letter-spacing: 0.1em;
      text-align: center;
    }
    .carousel-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #555;
      letter-spacing: 0.2em;
    }

    /* ── Main Swiper ── */
    .main-swiper {
      width: 100%;
      max-width: 900px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #222;
    }
    .main-swiper .swiper-slide {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
    }
    .main-swiper .slide-bg {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.6s var(--out-expo);
    }
    .main-swiper .swiper-slide-active .slide-bg {
      transform: scale(1);
    }
    .main-swiper .slide-content {
      text-align: center;
      z-index: 2;
      position: relative;
    }
    .main-swiper .slide-num {
      font-family: 'Fjalla One', serif;
      font-size: clamp(4rem, 12vw, 8rem);
      color: rgba(255,255,255,0.08);
      line-height: 1;
    }
    .main-swiper .slide-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.2em;
      margin-top: 0.5rem;
    }

    /* Slide gradients */
    .slide-bg-1 { background: linear-gradient(135deg, #0c1445, #1a0a3e); }
    .slide-bg-2 { background: linear-gradient(135deg, #1a0a3e, #0a2a1e); }
    .slide-bg-3 { background: linear-gradient(135deg, #0a2a1e, #2a1a0a); }
    .slide-bg-4 { background: linear-gradient(135deg, #2a1a0a, #2a0a1a); }
    .slide-bg-5 { background: linear-gradient(135deg, #2a0a1a, #0c1445); }

    /* Swiper pagination */
    .main-swiper .swiper-pagination-bullet {
      background: #444;
      opacity: 1;
      width: 24px; height: 3px;
      border-radius: 2px;
      transition: all 0.3s;
    }
    .main-swiper .swiper-pagination-bullet-active {
      background: var(--accent);
      width: 40px;
    }

    /* Swiper nav */
    .main-swiper .swiper-button-next,
    .main-swiper .swiper-button-prev {
      color: rgba(255,255,255,0.5);
      transition: color 0.3s;
    }
    .main-swiper .swiper-button-next:hover,
    .main-swiper .swiper-button-prev:hover {
      color: var(--accent);
    }

    /* Progress bar inside swiper */
    .swiper-progress {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: var(--accent);
      z-index: 10;
      transition: width 0.1s linear;
      width: 0%;
    }

    /* ── Thumbnail Swiper ── */
    .thumb-swiper {
      width: 100%;
      max-width: 900px;
      padding: 0 2rem;
    }
    .thumb-swiper .swiper-slide {
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      opacity: 0.4;
      cursor: pointer;
      transition: opacity 0.3s, border-color 0.3s;
    }
    .thumb-swiper .swiper-slide-thumb-active {
      opacity: 1;
      border-color: var(--accent);
    }
    .thumb-swiper .slide-bg {
      width: 100%; height: 100%;
    }

    /* ── Counter ── */
    .slide-counter {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      font-family: 'Fjalla One', serif;
    }
    .slide-counter .current {
      font-size: 2rem;
      color: var(--accent);
    }
    .slide-counter .sep { color: #333; font-size: 1rem; }
    .slide-counter .total { font-size: 1rem; color: #555; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.4s;
    }
    .modal-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }
    .modal-content {
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16/9;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.5s var(--out-expo);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.is-open .modal-content {
      transform: scale(1) translateY(0);
    }
    .modal-content .placeholder-video {
      font-family: 'Fjalla One', serif;
      font-size: 2rem;
      color: rgba(255,255,255,0.1);
      text-align: center;
    }
    .modal-content .placeholder-video .play-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: block;
    }
    .modal-close {
      position: fixed;
      top: 2rem; right: 2rem;
      width: 40px; height: 40px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      z-index: 2001;
      transition: border-color 0.3s, color 0.3s;
    }
    .modal-close:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .swiper-fallback { position: relative; }
    .swiper-fallback .swiper-wrapper { display: block; }
    .swiper-fallback .swiper-button-prev, .swiper-fallback .swiper-button-next {
      position: absolute; top: 50%; width: 44px; height: 44px; transform: translateY(-50%); z-index: 2;
    }
    .swiper-fallback .swiper-button-prev { left: 10px; }
    .swiper-fallback .swiper-button-next { right: 10px; }
    .swiper-fallback .swiper-button-prev::after { content: '‹'; font-size: 2rem; }
    .swiper-fallback .swiper-button-next::after { content: '›'; font-size: 2rem; }
    .swiper-fallback .swiper-slide:not(.swiper-slide-active) { display: none; }
    .thumb-fallback .swiper-wrapper { display: flex; gap: 12px; }
    .thumb-fallback .swiper-slide { flex: 1; }

    /* Controls row */
    .carousel-controls {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .play-btn {
      padding: 0.6rem 1.5rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      transition: all 0.3s;
    }
    .play-btn:hover {
      background: var(--accent);
      color: #0a0a0a;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <nav class="page-header">
    <a href="../index.html">Gallery</a>
    <span class="sep">/</span>
    <span class="current">06 Carousel + Lightbox</span>
  </nav>

  <div class="carousel-page">
    <div class="carousel-title">CAROUSEL</div>
    <div class="carousel-sub">SWIPER + LOOP + AUTOPLAY + LIGHTBOX</div>

    <!-- Main Swiper -->
    <div class="swiper main-swiper" id="mainSwiper" tabindex="0" role="region" aria-label="Color carousel" aria-roledescription="carousel">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <div class="slide-bg slide-bg-1">
            <div class="slide-content">
              <div class="slide-num">01</div>
              <div class="slide-label">MIDNIGHT BLUE</div>
            </div>
          </div>
        </div>
        <div class="swiper-slide">
          <div class="slide-bg slide-bg-2">
            <div class="slide-content">
              <div class="slide-num">02</div>
              <div class="slide-label">DEEP VIOLET</div>
            </div>
          </div>
        </div>
        <div class="swiper-slide">
          <div class="slide-bg slide-bg-3">
            <div class="slide-content">
              <div class="slide-num">03</div>
              <div class="slide-label">FOREST GREEN</div>
            </div>
          </div>
        </div>
        <div class="swiper-slide">
          <div class="slide-bg slide-bg-4">
            <div class="slide-content">
              <div class="slide-num">04</div>
              <div class="slide-label">AMBER GOLD</div>
            </div>
          </div>
        </div>
        <div class="swiper-slide">
          <div class="slide-bg slide-bg-5">
            <div class="slide-content">
              <div class="slide-num">05</div>
              <div class="slide-label">CRIMSON RED</div>
            </div>
          </div>
        </div>
      </div>
      <div class="swiper-pagination"></div>
      <button class="swiper-button-prev" type="button" aria-label="Previous slide"></button>
      <button class="swiper-button-next" type="button" aria-label="Next slide"></button>
      <div class="swiper-progress" id="swiperProgress"></div>
    </div>

    <!-- Thumbnails -->
    <div class="swiper thumb-swiper" id="thumbSwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><div class="slide-bg slide-bg-1"></div></div>
        <div class="swiper-slide"><div class="slide-bg slide-bg-2"></div></div>
        <div class="swiper-slide"><div class="slide-bg slide-bg-3"></div></div>
        <div class="swiper-slide"><div class="slide-bg slide-bg-4"></div></div>
        <div class="swiper-slide"><div class="slide-bg slide-bg-5"></div></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="carousel-controls">
      <div class="slide-counter">
        <span class="current" id="slideCurrent">01</span>
        <span class="sep">/</span>
        <span class="total" id="slideTotal">05</span>
      </div>
      <button class="play-btn" id="toggleAutoplay">PAUSE AUTOPLAY</button>
      <button class="play-btn" id="openModal">OPEN LIGHTBOX</button>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-label="Lightbox preview" aria-hidden="true" inert>
    <button class="modal-close" id="closeModal" aria-label="Close lightbox">✕</button>
    <div class="modal-content">
      <div class="placeholder-video">
        <span class="play-icon">▶</span>
        YOUTUBE EMBED WOULD GO HERE
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const mainElement = document.getElementById('mainSwiper');
    const thumbElement = document.getElementById('thumbSwiper');
    const toggleBtn = document.getElementById('toggleAutoplay');
    const modal = document.getElementById('modal');
    const closeButton = document.getElementById('closeModal');
    const openButton = document.getElementById('openModal');
    const thumbnails = [...thumbElement.querySelectorAll('.swiper-slide')];
    let mainSwiper = null;
    let thumbSwiper = null;
    let autoplayOn = !motion.matches;
    let modalOpen = false;
    let returnFocus = null;
    let backgroundState = [];
    let previousOverflow = '';
    let fallbackIndex = 0;

    function syncAutoplay() {
      const allowed = autoplayOn && !motion.matches;
      const running = allowed && !modalOpen && !document.hidden;
      if (mainSwiper) {
        if (running && !mainSwiper.autoplay.running) mainSwiper.autoplay.start();
        if (!running && mainSwiper.autoplay.running) mainSwiper.autoplay.stop();
      }
      toggleBtn.disabled = motion.matches || !mainSwiper;
      toggleBtn.textContent = motion.matches ? 'REDUCED MOTION' : !mainSwiper ? 'AUTOPLAY UNAVAILABLE' : allowed ? 'PAUSE AUTOPLAY' : 'RESUME AUTOPLAY';
      toggleBtn.setAttribute('aria-pressed', String(allowed && !!mainSwiper));
      if (!running) document.getElementById('swiperProgress').style.width = '0%';
    }
    function updateCounter(index) {
      document.getElementById('slideCurrent').textContent = String(index + 1).padStart(2, '0');
      thumbnails.forEach((el, i) => el.setAttribute('aria-pressed', String(i === index)));
    }
    function goTo(index) {
      index = (index + thumbnails.length) % thumbnails.length;
      if (mainSwiper) mainSwiper.slideToLoop(index);
      else {
        fallbackIndex = index;
        mainElement.querySelectorAll('.swiper-slide').forEach((el, i) => {
          el.classList.toggle('swiper-slide-active', i === index);
        });
        thumbnails.forEach((el, i) => el.classList.toggle('swiper-slide-thumb-active', i === index));
        updateCounter(index);
      }
    }
    if (window.Swiper) {
      thumbSwiper = new Swiper('#thumbSwiper', {
        slidesPerView: 4,
        speed: motion.matches ? 0 : 300,
        spaceBetween: 12,
        watchSlidesProgress: true,
        breakpoints: { 0: { slidesPerView: 3 }, 768: { slidesPerView: 4 } },
      });
      mainSwiper = new Swiper('#mainSwiper', {
        loop: true,
        speed: motion.matches ? 0 : 900,
        autoplay: { enabled: !motion.matches, delay: 5000, disableOnInteraction: false, pauseOnMouseEnter: true },
        pagination: { el: '.main-swiper .swiper-pagination', clickable: true },
        navigation: { nextEl: '.main-swiper .swiper-button-next', prevEl: '.main-swiper .swiper-button-prev' },
        thumbs: { swiper: thumbSwiper },
        on: {
          slideChange() { updateCounter(this.realIndex); },
          autoplayTimeLeft(s, time, progress) {
            document.getElementById('swiperProgress').style.width = ((1 - progress) * 100) + '%';
          },
        },
      });
    } else {
      mainElement.classList.add('swiper-fallback');
      thumbElement.classList.add('thumb-fallback');
      mainElement.querySelector('.swiper-button-prev').addEventListener('click', () => goTo(fallbackIndex - 1));
      mainElement.querySelector('.swiper-button-next').addEventListener('click', () => goTo(fallbackIndex + 1));
      goTo(0);
    }
    thumbnails.forEach((el, i) => {
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-label', `Show slide ${i + 1}`);
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goTo(i); }
      });
      if (!mainSwiper) el.addEventListener('click', () => goTo(i));
    });
    updateCounter(mainSwiper?.realIndex || 0);
    mainElement.addEventListener('keydown', e => {
      if (e.target !== mainElement || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      e.preventDefault();
      goTo((mainSwiper?.realIndex ?? fallbackIndex) + (e.key === 'ArrowRight' ? 1 : -1));
    });
    // Keyboard exploration stops rotation until the user explicitly resumes it.
    document.querySelector('.carousel-page').addEventListener('focusin', e => {
      if (e.target === toggleBtn) return;
      autoplayOn = false;
      syncAutoplay();
    });
    toggleBtn.addEventListener('click', () => { autoplayOn = !autoplayOn; syncAutoplay(); });
    motion.addEventListener('change', () => {
      if (motion.matches) autoplayOn = false;
      if (mainSwiper) mainSwiper.params.speed = motion.matches ? 0 : 900;
      if (thumbSwiper) thumbSwiper.params.speed = motion.matches ? 0 : 300;
      syncAutoplay();
    });
    document.addEventListener('visibilitychange', syncAutoplay);
    syncAutoplay();

    function openModal() {
      if (modalOpen) return;
      modalOpen = true;
      returnFocus = document.activeElement;
      previousOverflow = document.body.style.overflow;
      backgroundState = [...document.body.children]
        .filter(el => el !== modal && el.tagName !== 'SCRIPT')
        .map(el => [el, el.inert]);
      backgroundState.forEach(([el]) => { el.inert = true; });
      document.body.style.overflow = 'hidden';
      modal.inert = false;
      modal.removeAttribute('aria-hidden');
      modal.classList.add('is-open');
      closeButton.focus();
      syncAutoplay();
    }
    function closeModal() {
      if (!modalOpen) return;
      modalOpen = false;
      modal.classList.remove('is-open');
      modal.inert = true;
      backgroundState.forEach(([el, inert]) => { el.inert = inert; });
      document.body.style.overflow = previousOverflow;
      if (returnFocus?.isConnected) returnFocus.focus({ preventScroll: true });
      modal.setAttribute('aria-hidden', 'true');
      syncAutoplay();
    }
    openButton.addEventListener('click', openModal);
    closeButton.addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => {
      if (!modalOpen) return;
      if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
      if (e.key === 'Tab') { e.preventDefault(); closeButton.focus(); }
    });
    window.addEventListener('pagehide', () => {
      closeModal();
      mainSwiper?.autoplay.stop();
    });
    window.addEventListener('pageshow', syncAutoplay);
  </script>
</body>
</html>
